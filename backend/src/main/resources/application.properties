spring.application.name=FoodFlow
## MYSQL CONNECTION
spring.datasource.url=${MYSQL_URL}
spring.datasource.username=${MYSQL_USERNAME}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update

## JWT CONFIG
secretJwtString=${JWT_SECRET_KEY}

## MAIL CONFIG
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

## AWS CONFIG
aws.s3.region=${AWS_REGION}
aws.s3.bucket=${AWS_BUCKET_NAME}
aws.accessKeyId=${AWS_ACCESS_KEY_ID}
aws.secretKey=${AWS_SECRET_ACCESS_KEY}

## LOCAL React FRONTEND
base.payment.link=http://localhost:3000/pay?orderid=
frontend.base.url=http://localhost:3000

## STRIPE CREDENTIALS
stripe.api.public.key=${STRIPE_PUBLIC_KEY}
stripe.api.secret.key=${STRIPE_SECRET_KEY}